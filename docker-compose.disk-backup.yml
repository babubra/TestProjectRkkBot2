version: '3.8'

# Используем .env.compose вместо .env
# Запуск: docker-compose --env-file .env.compose up -d

services:
  # Backend API
  map-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rkk-map-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env.docker:/app/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/your_database.db
    restart: unless-stopped
    networks:
      - rkk-network

  # Telegram Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: rkk-bot
    volumes:
      - ./data:/app/data
      - ./.env.docker:/app/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/your_database.db
    restart: unless-stopped
    depends_on:
      - map-backend
    networks:
      - rkk-network

  # Frontend
  map-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Передаем ключи при сборке из .env файла
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY}
        VITE_API_BASE_URL: ""
    container_name: rkk-map-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - map-backend
    networks:
      - rkk-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  rkk-network:
    driver: bridge

volumes:
  data: